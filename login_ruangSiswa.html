<body>
  <main class="register-page">
    <!-- LEFT: FORM -->
    <section class="register-form">
      <div class="form-inner">

        <div class="school-brand">
          <i class="bi bi-mortarboard-fill"></i>
          <span><a href="../html/index.html" class="school-name">SMK KETINTANG SURABAYA</a></span>
        </div>

        <div class="heading">
          <h1>Masuk Ke Kelasmu</h1>
          <p>Lanjutkan materi, tugas!</p>
        </div>

        <form>

          <div class="input-wrap">
            <i class="bi bi-envelope"></i>
            <input type="email" class="form-control" placeholder="Email" autocomplete="email">
          </div>

          <div class="input-wrap">
            <i class="bi bi-lock"></i>
            <input type="password" class="form-control" placeholder="Kata sandi" autocomplete="new-password">
          </div>

          <a href="dasboard.html" class="btn register-btn">DAFTAR</a>
        </form>

        <p class="login-text">
          Lupa sandi? <a href="#">Masuk di sini</a> 
        </p>

      </div>
    </section>

    <!-- RIGHT: REFERENCE PANEL -->
    <section class="welcome-panel">
      <img src="gambar/WhatsApp_Image_2026-09-10_at_12.47.04-removebg-preview.png" alt="" class="reference-panel">
    </section>
  </main>
